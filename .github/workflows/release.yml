name: Build and attach downloads

# Push a tag (v*) and the three downloadable builds appear on that release:
# macOS on Apple Silicon, macOS on Intel, and Windows x64. Run it by hand
# (workflow_dispatch) to get the same zips as workflow artifacts without
# touching any release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 retires on 2 Nov 2026; macos-15-intel is the x86_64
          # image GitHub replaced macos-13 with (retired Dec 2025).
          - runner: macos-15        # Apple Silicon
            arch: AppleSilicon
          - runner: macos-15-intel  # Intel x86_64
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Install SDL2 and pkg-config
        run: brew install sdl2 pkg-config

      - name: Build
        run: ./bin/build

      - name: Bundle and sign (ad hoc)
        run: |
          APP="$(ls -d build/*.app | head -1)"
          # -qmldir is not optional: the QML lives inside the binary's qrc,
          # so macdeployqt cannot discover the imports on its own and the
          # bundle would start with "module QtQuick is not installed".
          macdeployqt "$APP" -qmldir="$PWD/src" -libpath="$(brew --prefix)/lib" \
                      -always-overwrite
          # arm64 refuses to run an unsigned bundle, so it is signed here even
          # though there is no Developer ID: the Gatekeeper prompt is answered
          # by the user with right-click -> Open (see the README in the zip).
          codesign --deep --force --sign - "$APP"

      - name: Check the bundle is complete
        run: |
          APP="$(ls -d build/*.app | head -1)"
          # The two things that broke the first bundle are checked here: the
          # QML modules (macdeployqt cannot see them without -qmldir) and the
          # SDL2 library (it is not a Qt library).
          test -d "$APP/Contents/Resources/qml/QtQuick" || { echo "QML modules missing from the bundle"; exit 1; }
          test -f "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib" || { echo "SDL2 missing from the bundle"; exit 1; }
          test -x "$APP/Contents/MacOS/oligarchy-tanks" || { echo "the executable is missing"; exit 1; }
          echo "bundle complete: $(du -sh "$APP" | cut -f1)"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist/OligarchyTanks
          cp -R build/*.app dist/OligarchyTanks/
          cp packaging/README-macOS.txt dist/OligarchyTanks/README.txt
          (cd dist && ditto -c -k --sequesterRsrc --keepParent OligarchyTanks \
             "OligarchyTanks-${VER}-macOS-${{ matrix.arch }}.zip")

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: OligarchyTanks-macOS-${{ matrix.arch }}
          path: dist/*.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 and the dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-tools

      - name: Build
        run: ./bin/build

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist/app
          # qmake puts the binary under build/release on Windows.
          EXE="$(find build -name 'oligarchy-tanks.exe' | head -1)"
          cp "$EXE" dist/app/
          # Same reason as macdeployqt: the QML is in the qrc, so the imports
          # have to be scanned from the sources.
          windeployqt --release --qmldir "$PWD/src" dist/app/oligarchy-tanks.exe
          # windeployqt knows Qt only: SDL2 travels by hand.
          cp /ucrt64/bin/SDL2.dll dist/app/
          cp packaging/README-Windows.txt dist/app/README.txt
          (cd dist/app && zip -r "../OligarchyTanks-${VER}-Windows-x64.zip" .)

      - name: Check the bundle is complete
        run: |
          # Same two checks as macOS, in the Windows layout: the DLLs and QML
          # modules windeployqt places next to the exe, plus SDL2.
          test -f dist/app/SDL2.dll || { echo "SDL2.dll missing"; exit 1; }
          test -d dist/app/qml/QtQuick || { echo "QML modules missing"; exit 1; }
          test -f dist/app/oligarchy-tanks.exe || { echo "the executable is missing"; exit 1; }
          du -sh dist/app

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: OligarchyTanks-Windows-x64
          path: dist/*.zip

  publish:
    name: Attach to the release
    needs: [macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Collect the three zips
        uses: actions/download-artifact@v4
        with:
          pattern: OligarchyTanks-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # A candidate (v0.2.4-rc1) is not a release: it stays marked as a
          # pre-release so nobody downloads it by mistake.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
