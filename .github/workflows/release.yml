name: Build and attach downloads

# Push a tag (v*) and the three downloadable builds appear on that release:
# macOS on Apple Silicon, macOS on Intel, and Windows x64. Run it by hand
# (workflow_dispatch) to get the same zips as workflow artifacts without
# touching any release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 retires on 2 Nov 2026; macos-15-intel is the x86_64
          # image GitHub replaced macos-13 with (retired Dec 2025).
          - runner: macos-15        # Apple Silicon
            arch: AppleSilicon
          - runner: macos-15-intel  # Intel x86_64
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Install pkg-config
        run: brew install pkg-config

      - name: Build SDL2 from source
        # Homebrew's "sdl2" is sdl2-compat: a shim that loads SDL3 at run
        # time. macdeployqt copies the shim and not SDL3, and the app dies on
        # the tester's Mac ("failed to load SDL3"). A real SDL 2.30 links
        # system frameworks only, so the bundle stays self-contained.
        run: |
          curl -L -o sdl2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          tar xzf sdl2.tar.gz
          cmake -S SDL2-2.30.9 -B sdl2-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PWD/sdl2" \
                -DSDL_TEST=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl2-build -j"$(sysctl -n hw.ncpu)"
          cmake --install sdl2-build

      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/sdl2/lib/pkgconfig
        run: ./bin/build

      - name: Bundle and sign (ad hoc)
        run: |
          APP="$(ls -d build/*.app | head -1)"
          # -qmldir is not optional: the QML lives inside the binary's qrc,
          # so macdeployqt cannot discover the imports on its own and the
          # bundle would start with "module QtQuick is not installed".
          # The SDL2 built here installs with an @rpath install name, so its
          # directory has to be one of macdeployqt's search paths.
          macdeployqt "$APP" -qmldir="$PWD/src" \
                      -libpath="$PWD/sdl2/lib" -libpath="$(brew --prefix)/lib" \
                      -always-overwrite
          # Belt and braces: if macdeployqt still skipped it, place the dylib
          # and point the executable at it.
          if [ ! -f "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib" ]; then
            cp "$PWD/sdl2/lib/libSDL2-2.0.0.dylib" "$APP/Contents/Frameworks/"
            install_name_tool -id "@rpath/libSDL2-2.0.0.dylib" \
              "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib"
            install_name_tool -add_rpath "@executable_path/../Frameworks" \
              "$APP/Contents/MacOS/oligarchy-tanks" 2>/dev/null || true
          fi
          # arm64 refuses to run an unsigned bundle, so it is signed here even
          # though there is no Developer ID: the Gatekeeper prompt is answered
          # by the user with right-click -> Open (see the README in the zip).
          codesign --deep --force --sign - "$APP"

      - name: Check the bundle is complete
        run: |
          APP="$(ls -d build/*.app | head -1)"
          # The two things that broke the first bundle are checked here: the
          # QML modules (macdeployqt cannot see them without -qmldir) and the
          # SDL2 library (it is not a Qt library).
          test -d "$APP/Contents/Resources/qml/QtQuick" || { echo "QML modules missing from the bundle"; exit 1; }
          test -f "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib" || { echo "SDL2 missing from the bundle"; exit 1; }
          test -x "$APP/Contents/MacOS/oligarchy-tanks" || { echo "the executable is missing"; exit 1; }
          # No absolute Homebrew path may survive, and nothing may still want
          # SDL3: that was the fatal error on the tester's Mac.
          if otool -L "$APP/Contents/MacOS/oligarchy-tanks" | grep -qE "/opt/homebrew|/usr/local/opt"; then
            echo "the binary still points at a Homebrew library"; exit 1
          fi
          if otool -L "$APP/Contents/MacOS/oligarchy-tanks" | grep -qi "SDL3"; then
            echo "the binary still depends on SDL3"; exit 1
          fi
          echo "bundle complete: $(du -sh "$APP" | cut -f1)"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist/OligarchyTanks
          cp -R build/*.app dist/OligarchyTanks/
          cp packaging/README-macOS.txt dist/OligarchyTanks/README.txt
          (cd dist && ditto -c -k --sequesterRsrc --keepParent OligarchyTanks \
             "OligarchyTanks-${VER}-macOS-${{ matrix.arch }}.zip")

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: OligarchyTanks-macOS-${{ matrix.arch }}
          path: dist/*.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 and the dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-tools

      - name: Build
        run: ./bin/build

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist/app
          # qmake puts the binary under build/release on Windows.
          EXE="$(find build -name 'oligarchy-tanks.exe' | head -1)"
          cp "$EXE" dist/app/
          # Same reason as macdeployqt: the QML is in the qrc, so the imports
          # have to be scanned from the sources.
          windeployqt --release --qmldir "$PWD/src" dist/app/oligarchy-tanks.exe
          # windeployqt knows Qt only: SDL2 travels by hand.
          cp /ucrt64/bin/SDL2.dll dist/app/

          # An MSYS2 Qt also links the MinGW runtime (libstdc++, libgcc,
          # libwinpthread) and libraries such as libb2, libicu and zlib, and
          # windeployqt deploys none of them. Walk the imports and copy every
          # DLL that exists in the toolchain; whatever is left is a Windows
          # DLL and belongs to the system.
          copy_deps() {
            # Seed the queue with everything already deployed — the plugins
            # windeployqt copied matter as much as the exe: avcodec-63.dll
            # (the audio backend) alone links dozens of codec libraries.
            local pending=()
            while IFS= read -r f; do pending+=("$f"); done < <(
              find dist/app -type f \( -name '*.dll' -o -name '*.exe' \)
            )
            while [ ${#pending[@]} -gt 0 ]; do
              local file="${pending[0]}"
              pending=("${pending[@]:1}")
              for dll in $(objdump -p "$file" | awk '/DLL Name:/ {print $3}'); do
                [ -f "dist/app/$dll" ] && continue
                if [ -f "/ucrt64/bin/$dll" ]; then
                  cp "/ucrt64/bin/$dll" dist/app/
                  pending+=("dist/app/$dll")
                fi
              done
            done
          }
          copy_deps

          cp packaging/README-Windows.txt dist/app/README.txt
          (cd dist/app && zip -r "../OligarchyTanks-${VER}-Windows-x64.zip" .)

      - name: Check the bundle is complete
        run: |
          # Same two checks as macOS, in the Windows layout: the DLLs and QML
          # modules windeployqt places next to the exe, plus SDL2.
          test -f dist/app/SDL2.dll || { echo "SDL2.dll missing"; exit 1; }
          test -d dist/app/qml/QtQuick || { echo "QML modules missing"; exit 1; }
          test -f dist/app/oligarchy-tanks.exe || { echo "the executable is missing"; exit 1; }
          # The MinGW runtime was the other silent hole in the first zip.
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            test -f "dist/app/$dll" || { echo "$dll missing"; exit 1; }
          done
          du -sh dist/app

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: OligarchyTanks-Windows-x64
          path: dist/*.zip

  publish:
    name: Attach to the release
    needs: [macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Collect the three zips
        uses: actions/download-artifact@v4
        with:
          pattern: OligarchyTanks-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # A candidate (v0.2.4-rc1) is not a release: it stays marked as a
          # pre-release so nobody downloads it by mistake.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
